<section class="hero">
  <div class="hero-bg"></div>
  <div class="hero-overlay"></div>
  <div class="hero-orb hero-orb--one"></div>
  <div class="hero-orb hero-orb--two"></div>
  <div class="hero-grain"></div>

  <div class="container hero-container">
    <div class="hero-grid">
      <!-- Colonne Texte -->
      <div class="hero-text-content">
        <h1 class="hero-title anim-up anim-up--d1">
          <span class="hero-title-top">De la ferme</span>
          <span class="hero-title-accent">à l'assiette</span>
        </h1>
        <p class="hero-description anim-up anim-up--d2">
          Élevage traditionnel éco-responsable, produits frais et cuisine béninoise d'exception · de Porto-Novo à votre table.
        </p>
        <div class="hero-actions anim-up anim-up--d3">
          <a routerLink="/menu" class="btn btn-primary btn-lg">Découvrir le Menu</a>
          <a routerLink="/ferme" class="btn btn-outline-light btn-lg">La Ferme & Pépinière</a>
        </div>
      </div>

      <!-- Colonne Diaporama Images (Rotation infinie) -->
      <div class="hero-image-wrapper anim-up anim-up--d2">
        @for (slide of slides; track slide; let i = $index) {
          <img
            [src]="slide"
            alt="Saveurs d'Agojiés - Cuisine & Ferme"
            class="hero-img-slide"
            [class.active]="currentSlide() === i"
            loading="eager"
          >
        }
      </div>
    </div>
  </div>

  <div class="hero-fade"></div>
</section>
